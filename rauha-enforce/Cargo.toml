[package]
name = "rauha-enforce"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rauha-enforce"
path = "src/main.rs"

[dependencies]
# Shared types
rauha-common = { path = "../rauha-common" }

# Async runtime
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# CLI
clap.workspace = true

# Error handling
anyhow.workspace = true

# Serialization
serde.workspace = true
toml.workspace = true

# Containerd client
containerd-client = { version = "0.8", features = ["connect"] }
prost.workspace = true
prost-types = "0.13"

# Serialization (JSON)
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rauha-ebpf-common = { path = "../rauha-ebpf-common", features = ["userspace"] }
aya.workspace = true
nix.workspace = true
