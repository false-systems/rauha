name: Privileged Linux

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-rauha-privileged
  cancel-in-progress: false

jobs:
  runtime:
    name: Integration and oracle
    runs-on: arc-arm64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y crun dwarves jq libssl-dev nftables pkg-config protobuf-compiler

      - name: Install nightly Rust
        run: rustup toolchain install nightly --component rust-src

      - uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install bpf-linker
        run: cargo binstall --no-confirm bpf-linker@0.11.0

      # false-systems/sykli is currently public, so the install below needs
      # no token. If it ever goes private again, set the SYKLI_READ_TOKEN
      # repository secret (fine-grained PAT or GitHub App token with
      # contents:read on that repository): the credential helper is then
      # configured for this step only and the token never lands on disk.
      - name: Install Sykli
        env:
          SYKLI_READ_TOKEN: ${{ secrets.SYKLI_READ_TOKEN }}
        run: |
          if [ -n "$SYKLI_READ_TOKEN" ]; then
            git config --global credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "$SYKLI_READ_TOKEN"; }; f'
          fi
          CARGO_NET_GIT_FETCH_WITH_CLI=true cargo install --git https://github.com/false-systems/sykli --rev 71d264367852c9f5df737f223be3b6efbf791ca8 --locked sykli
          if [ -n "$SYKLI_READ_TOKEN" ]; then
            git config --global --unset credential.helper
          fi

      - name: Run locked security graph
        run: bash tests/security/run.sh

      - name: Upload execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rauha-security-receipt
          path: .sykli/receipt.json
          if-no-files-found: error
