name: Privileged Linux

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-rauha-privileged
  cancel-in-progress: false

jobs:
  runtime:
    name: Integration and oracle
    runs-on: arc-arm64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y crun dwarves jq libssl-dev nftables pkg-config protobuf-compiler

      - name: Install nightly Rust
        run: rustup toolchain install nightly --component rust-src

      - uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install bpf-linker
        run: cargo binstall --no-confirm bpf-linker@0.11.0

      - name: Run the security gate
        run: bash tests/security/linux-gate.sh

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rauha-security-gate
          path: .gate
          if-no-files-found: warn
