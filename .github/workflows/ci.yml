name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

jobs:
  quality:
    name: Workspace quality
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config protobuf-compiler build-essential

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  ebpf:
    name: eBPF build
    # Same rule as `privileged` below, and for the same reason: this is a
    # self-hosted runner inside the false-infra cluster, and a fork pull request
    # on a public repository would be running its own code there. The guard was
    # on the privileged job and not on this one (false-infra#207).
    #
    # It cannot move to a hosted runner the way `quality` did — loading eBPF
    # needs a kernel a hosted runner does not give — so the job is skipped for
    # fork contributions instead. A maintainer moves the contribution onto a
    # repository branch and it runs there, which is already the stated policy
    # for `privileged`.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-arm64   # stays: loads eBPF, needs a kernel a hosted runner does not give
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential dwarves

      - name: Install nightly Rust
        run: rustup toolchain install nightly --component rust-src

      - uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install bpf-linker
        run: cargo binstall --no-confirm bpf-linker@0.11.0

      - name: Build eBPF object and offsets
        run: cargo xtask build-ebpf

  # Never execute fork code on a privileged self-hosted runner. A maintainer
  # must move an external contribution onto a repository branch first.
  privileged:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/privileged.yml
